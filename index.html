<!DOCTYPE html>
<html>
<head>
  <title>City Walk Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    button {
      padding: 14px 20px;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
    }

    ul {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Gothenburg Sightseeing Walk</h1>

  <button onclick="openRoute()">
    Open Walking Route in Google Maps
  </button>

  <ul id="places"></ul>

  <script>
    const places = [
      {
        "name": "Universeum",
        "lat": 57.7053,
        "lng": 11.9654
      },
      {
        "name": "Gothenburg Museum of Art (Göteborgs Konstmuseum)",
        "lat": 57.7078,
        "lng": 11.9885
      },
      {
        "name": "Liseberg Amusement Park",
        "lat": 57.7021,
        "lng": 11.9784
      },
      {
        "name": "Botanical Garden (Botaniska Trädgården)",
        "lat": 57.6956,
        "lng": 11.9733
      },
      {
        "name": "Haga District (Haga Church)",
        "lat": 57.7044,
        "lng": 11.9693
      }
    ];

    // Show list on page
    const ul = document.getElementById("places");

    places.forEach(place => {
      const li = document.createElement("li");
      li.textContent = place.name;
      ul.appendChild(li);
    });

    function openRoute() {

      // Google Maps supports:
      // origin
      // destination
      // waypoints

      const origin =
        `${places[0].lat},${places[0].lng}`;

      const destination =
        `${places[places.length - 1].lat},${places[places.length - 1].lng}`;

      const waypoints = places
        .slice(1, places.length - 1)
        .map(p => `${p.lat},${p.lng}`)
        .join("|");

      const url =
        `https://www.google.com/maps/dir/?api=1` +
        `&origin=${origin}` +
        `&destination=${destination}` +
        `&waypoints=${waypoints}` +
        `&travelmode=walking`;

      window.open(url, "_blank");
    }
  </script>

</body>
</html>
