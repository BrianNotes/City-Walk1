<!DOCTYPE html>
<html>
<head>
  <title>AI City Walk Planner</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    ul {
      margin-top: 20px;
      padding-left: 20px;
    }

    li {
      margin-bottom: 8px;
    }

    .debug {
      font-size: 12px;
      color: gray;
      white-space: pre-wrap;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>AI City Walk Planner</h1>

  <input id="cityInput" placeholder="Enter a city (e.g. London)">

  <button onclick="generateWalk()">Generate Walk</button>
  <button onclick="openRoute()">Open Walking Route</button>

  <ul id="places"></ul>

  <div class="debug" id="debug"></div>

  <script>

    let places = [];

    function log(msg) {
      console.log(msg);
      document.getElementById("debug").innerText += msg + "\n";
    }

    async function generateWalk() {

      document.getElementById("debug").innerText = "";

      const city = document.getElementById("cityInput").value;

      if (!city) {
        alert("Please enter a city");
        return;
      }

      const apiUrl =
        "https://devotion-chastise-unfasten.ngrok-free.dev/city?city="
        + encodeURIComponent(city);

      log("Requesting: " + apiUrl);

      try {

        const response = await fetch(apiUrl, {
          method: "GET",
          headers: {
            "x-api-key": "sweden26!"
          }
        });

        log("STATUS: " + response.status);

        const text = await response.text();

        log("RAW RESPONSE:\n" + text);

        if (!response.ok) {
          throw new Error("HTTP error " + response.status);
        }

        const data = JSON.parse(text);

        places = data;

        displayPlaces();

      } catch (err) {

        log("ERROR: " + err.message);
        alert("Failed to connect to AI server");
      }
    }

    function displayPlaces() {

      const ul = document.getElementById("places");
      ul.innerHTML = "";

      places.forEach(p => {
        const li = document.createElement("li");
        li.textContent = p.name;
        ul.appendChild(li);
      });
    }

    function openRoute() {

      if (!places || places.length < 2) {
        alert("Generate a walk first");
        return;
      }

      const origin = `${places[0].lat},${places[0].lng}`;

      const destination = `${places[places.length - 1].lat},${places[places.length - 1].lng}`;

      const waypoints = places
        .slice(1, places.length - 1)
        .map(p => `${p.lat},${p.lng}`)
        .join("|");

      const url =
        `https://www.google.com/maps/dir/?api=1` +
        `&origin=${origin}` +
        `&destination=${destination}` +
        `&waypoints=${waypoints}` +
        `&travelmode=walking`;

      window.open(url, "_blank");
    }

  </script>

</body>
</html>
